<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- img-src 显式放行 data: —— spritesheet 小于 Vite assetsInlineLimit(4KB) 时会被内联为
       data: URI，若不放行会被 default-src 'self' 拦截导致帧图白屏 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws://127.0.0.1:* http://127.0.0.1:* http://localhost:* ws://localhost:*">
  <title>优墨</title>
  <style>
    /* 桌宠窗口强制透明：!important 兜底，防止任何样式表铺背景 */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background: transparent !important;
      background-color: transparent !important;
      overflow: hidden !important;
      user-select: none;
    }
    #pet-root { background: transparent !important; }
  </style>
</head>
<body>
  <div id="pet-root"></div>
  <script type="module" src="./pet-main.js"></script>
</body>
</html>
