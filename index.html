<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws://127.0.0.1:* http://127.0.0.1:* http://localhost:* ws://localhost:*; img-src 'self' data:">
  <title>优墨</title>
  <style>
    /* 静态内联样式：先于任何 JS 执行，消除渲染进程加载期的白屏。
       与 src/styles/tokens.css 保持同一套「墨夜 · 琥珀」色彩。 */
    :root { color-scheme: dark; }
    html, body {
      background: #090C11;
      margin: 0;
    }
    #boot-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      background:
        radial-gradient(720px 480px at 50% 22%, rgba(239, 168, 76, 0.10), transparent 62%),
        #090C11;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC', sans-serif;
      transition: opacity 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    #boot-loading.boot-hidden {
      opacity: 0;
      pointer-events: none;
    }
    /* 品牌标记：黑猫落在浅色「月光瓦片」上，与侧栏 logo 同一造型 */
    .boot-mark {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(150deg, #FBF0DA 0%, #E9D2A6 100%);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.16),
        0 16px 50px -12px rgba(239, 168, 76, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
      animation: boot-breathe 3.2s ease-in-out infinite;
    }
    .boot-mark svg {
      width: 40px;
      height: 40px;
    }
    .boot-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .boot-title {
      font-size: 17px;
      font-weight: 700;
      color: #EBE9E4;
      letter-spacing: 0.34em;
      text-indent: 0.34em;
    }
    .boot-hint {
      font-size: 12px;
      color: #7B8392;
      letter-spacing: 0.04em;
    }
    .boot-dots::after {
      content: '';
      display: inline-block;
      width: 14px;
      text-align: left;
      animation: boot-dots 1.4s steps(4, end) infinite;
    }
    /* 顶部一道极细的琥珀进度光带，暗示"正在启动"而不用转圈催促 */
    .boot-track {
      position: relative;
      width: 132px;
      height: 2px;
      border-radius: 2px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.06);
    }
    .boot-track::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 44%;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, #EFA84C, transparent);
      animation: boot-slide 1.6s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes boot-breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.025); }
    }
    @keyframes boot-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    @keyframes boot-dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot-mark, .boot-track::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <!-- 全屏启动加载层：系统就绪（WebSocket 建立）后由 App.vue 淡出移除 -->
  <div id="boot-loading">
    <div class="boot-mark">
      <!-- 内联黑猫剪影：与 assets/icon.png 同造型，但不依赖静态资源路径，打包后依然可见 -->
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path fill="#0A0A0B" d="M4 6l6 3h12l6-3v13a12 12 0 0 1-24 0z" />
        <circle cx="12" cy="17" r="2.7" fill="#FBF0DA" />
        <circle cx="20" cy="17" r="2.7" fill="#FBF0DA" />
        <circle cx="12" cy="17.4" r="1.15" fill="#0A0A0B" />
        <circle cx="20" cy="17.4" r="1.15" fill="#0A0A0B" />
      </svg>
    </div>
    <div class="boot-text">
      <div class="boot-title">优墨</div>
      <div class="boot-track"></div>
      <div class="boot-hint">正在唤醒本喵<span class="boot-dots"></span></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
